name: GST Desk D1 persistence checks
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/workers/gst-desk-preview/**'
      - 'database/migrations/**'
      - 'tests/cloud-state.test.mjs'
      - 'tests/overview.test.mjs'
      - 'tests/shipping.test.mjs'
      - 'tests/shipping-browser.test.mjs'
      - 'tests/shipping-label-import.test.mjs'
      - 'tests/snapshot-cache.test.mjs'
      - 'tests/premium-label-parser.test.mjs'
      - '.github/workflows/cloud-state.yml'
  pull_request:
    paths:
      - 'cloudflare/workers/gst-desk-preview/**'
      - 'database/migrations/**'
      - 'tests/cloud-state.test.mjs'
      - 'tests/overview.test.mjs'
      - 'tests/shipping.test.mjs'
      - 'tests/shipping-browser.test.mjs'
      - 'tests/shipping-label-import.test.mjs'
      - 'tests/snapshot-cache.test.mjs'
      - 'tests/premium-label-parser.test.mjs'
      - '.github/workflows/cloud-state.yml'
permissions:
  contents: read
jobs:
  cloud-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser DOM test runtime
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Syntax checks
        run: |
          node --check cloudflare/workers/gst-desk-preview/worker.js
          node --check cloudflare/workers/gst-desk-preview/worker.d1-pending.mjs
          node --check cloudflare/workers/gst-desk-preview/state-api.mjs
          node --check cloudflare/workers/gst-desk-preview/cloud-state-client.mjs
          node --check cloudflare/workers/gst-desk-preview/overview-api.mjs
          node --check cloudflare/workers/gst-desk-preview/overview-client.mjs
          node --check cloudflare/workers/gst-desk-preview/shipping-api.mjs
          node --check cloudflare/workers/gst-desk-preview/shipping-client.mjs
          node --check cloudflare/workers/gst-desk-preview/server-snapshot.mjs
          node --check cloudflare/workers/gst-desk-preview/premium-theme.mjs
          node --check cloudflare/workers/gst-desk-preview/label-invoice-parser.mjs
      - name: State API security and client tests
        run: node --test tests/cloud-state.test.mjs tests/overview.test.mjs tests/shipping.test.mjs tests/shipping-browser.test.mjs tests/shipping-label-import.test.mjs tests/snapshot-cache.test.mjs tests/premium-label-parser.test.mjs
